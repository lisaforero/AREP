<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microframework test page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
            color: #3b0764;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(128, 90, 213, 0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 { 
            color: #7c3aed; 
            margin-bottom: 10px;
        }
        p { 
            line-height: 1.6; 
            color: #4c1d95;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .btn:hover { 
            background-color: #6d28d9; 
            transform: translateY(-2px);
        }
        .route {
            margin-top: 15px;
            font-size: 0.9em;
            background-color: #f5f3ff;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            color: #5b21b6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello!</h1>
        <p>
            This is a test page for the web microframework lab.
        </p>
        <div class="route">
            http://localhost:8080/index.html
        </div>
        <p>Test successful</p>
    </div>
</body>
</html>
